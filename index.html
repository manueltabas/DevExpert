<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Night Scorekeeper</title>
    <meta
      name="description"
      content="A playful board-game scorekeeper shell for local game history and scores."
    >
    <link rel="stylesheet" href="./src/styles.css">
    <link rel="icon" href="data:,">
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="app-shell">
      <header class="site-header" aria-label="App header">
        <div>
          <p class="eyebrow">Board-game scorekeeper</p>
          <h1>Game night</h1>
        </div>
        <div class="marker-strip" aria-label="Available player colors">
          <span class="marker marker-blue"></span>
          <span class="marker marker-red"></span>
          <span class="marker marker-yellow"></span>
          <span class="marker marker-green"></span>
          <span class="marker marker-orange"></span>
          <span class="marker marker-white"></span>
          <span class="marker marker-black"></span>
        </div>
      </header>

      <main id="main-content" class="home-layout">
        <div id="app" data-app-root></div>
      </main>

      <footer class="site-footer">
        <span>Local-first scorekeeping</span>
        <span>Built for one scorekeeper</span>
        <span data-current-year></span>
      </footer>
    </div>
  </body>
</html>
