<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Night Scorekeeper</title>
    <meta
      name="description"
      content="A playful board-game scorekeeper shell for local game history and scores."
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="./src/styles.css">
    <link rel="icon" href="data:,">
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="app-shell">
      <header class="site-header" aria-label="App header">
        <div class="brand-block">
          <div class="brand-copy">
            <p class="eyebrow">Board-game scorekeeper</p>
            <h1>Game night</h1>
          </div>
          <div class="marker-strip" aria-label="Available player colors">
            <span class="marker marker-blue"></span>
            <span class="marker marker-red"></span>
            <span class="marker marker-yellow"></span>
            <span class="marker marker-green"></span>
            <span class="marker marker-orange"></span>
            <span class="marker marker-white"></span>
            <span class="marker marker-black"></span>
          </div>
        </div>
        <nav class="top-nav" aria-label="Primary">
          <button type="button" class="nav-item" data-action="nav-dashboard">Dashboard</button>
          <button type="button" class="nav-item" data-action="nav-new-game">New Game</button>
          <button type="button" class="nav-item" data-action="nav-active-game">Active Game</button>
        </nav>
      </header>

      <main id="main-content" class="home-layout">
        <div id="app" data-app-root></div>
      </main>

      <footer class="site-footer">
        <span>Local-first scorekeeping</span>
        <span>Built for one scorekeeper</span>
        <span data-current-year></span>
      </footer>
    </div>
  </body>
</html>
